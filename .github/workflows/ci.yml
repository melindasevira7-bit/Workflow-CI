name: CI Workflow - Training Model

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan menjalankan workflow secara manual'
        required: false
        default: 'Manual trigger'

jobs:
  training:
    name: Train Model with MLflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy nltk dagshub seaborn matplotlib

      - name: Train Model with MLflow Run
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P dataset_path=smsa_preprocessing/smsa_preprocessed.csv \
            -P max_features=5000 \
            -P ngram_range=1,2 \
            -P C=1.0 \
            -P test_size=0.2 \
            -P random_state=42

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            confusion_matrix.png
            classification_report.json
          retention-days: 30

      - name: Build Docker Image
        run: |
          cd MLProject
          mlflow models build-docker \
            --model-uri "runs:/$(python -c "import mlflow; mlflow.set_tracking_uri('https://dagshub.com/melindasevira7-bit/Eksperimen_SML_Melinda-Sevira.mlflow'); runs = mlflow.search_runs(experiment_names=['Workflow_CI_Klasifikasi_Sentimen'], order_by=['start_time DESC'], max_results=1); print(runs.iloc[0]['run_id'])")/model" \
            --name "melindasevira7bit/klasifikasi-sentimen" \
            --enable-mlserver
        continue-on-error: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push melindasevira7bit/klasifikasi-sentimen
        continue-on-error: true
