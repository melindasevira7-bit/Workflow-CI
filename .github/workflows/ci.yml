name: CI Workflow - Training Model

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan menjalankan workflow secara manual'
        required: false
        default: 'Manual trigger'

jobs:
  training:
    name: Train Model with MLflow
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy nltk dagshub seaborn matplotlib

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/melindasevira7-bit/Eksperimen_SML_Melinda-Sevira.mlflow" >> $GITHUB_ENV

      - name: Train Model with MLflow Run
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: melindasevira7-bit
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/melindasevira7-bit/Eksperimen_SML_Melinda-Sevira.mlflow
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P dataset_path=MLProject/smsa_preprocessing/smsa_preprocessed.csv \
            -P max_features=5000 \
            -P ngram_range=1,2 \
            -P C=1.0 \
            -P test_size=0.2 \
            -P random_state=42

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            confusion_matrix.png
            classification_report.json
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        env:
          MLFLOW_TRACKING_USERNAME: melindasevira7-bit
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/melindasevira7-bit/Eksperimen_SML_Melinda-Sevira.mlflow
        run: |
          RUN_ID=$(python -c "
          import mlflow
          import os
          mlflow.set_tracking_uri('https://dagshub.com/melindasevira7-bit/Eksperimen_SML_Melinda-Sevira.mlflow')
          runs = mlflow.search_runs(
              experiment_names=['Workflow_CI_Klasifikasi_Sentimen'],
              order_by=['start_time DESC'],
              max_results=1
          )
          print(runs.iloc[0]['run_id'])
          ")
          echo "Run ID: $RUN_ID"
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "melindasevirayangcantik/klasifikasi-sentimen" \
            --enable-mlserver
          docker push melindasevirayangcantik/klasifikasi-sentimen
        continue-on-error: true
